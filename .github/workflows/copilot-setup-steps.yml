name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    env:
      BACKEND_REQUIREMENTS_FILE: automated-blog-system/requirements.txt
    # Copilot setup steps currently cap job timeout at 59 minutes.
    timeout-minutes: 59
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.BACKEND_REQUIREMENTS_FILE }}

      - name: Install backend dependencies
        run: python -m pip install -r "${BACKEND_REQUIREMENTS_FILE}"

      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep || (sudo apt-get update && sudo apt-get install -y ripgrep)
